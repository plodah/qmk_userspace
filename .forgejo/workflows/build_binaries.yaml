name: Build QMK firmware

on: [push, workflow_dispatch]

jobs:
  build:
    name: 'QMK Userspace Build'
    uses: ./.forgejo/workflows/qmk_userspace_build.yml
    if: forgejo.ref == 'refs/heads/main'
    with:
      qmk_repo: plodah/qmk_firmware
      qmk_ref: mybuilds-2026-06-15
      release_name: autobuild
  publish:
    name: 'QMK Userspace Publish'
    uses: ./.forgejo/workflows/qmk_userspace_publish.yml
    if: forgejo.ref == 'refs/heads/main' && always() && !cancelled()
    needs: build
    with:
      release_name: autobuild
